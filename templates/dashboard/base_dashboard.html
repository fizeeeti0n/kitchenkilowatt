<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin Dashboard — Kitchen & Kilowatt{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0f1013;
            --text-main: #e4e4e7;
            --text-muted: #71717a;
            --primary-copper: #e07a38;
            --copper-glow: rgba(224, 122, 56, 0.2);
            --card-bg: #18181b;
            --card-border: #27272a;
            --sidebar-bg: #09090b;
            --hover-bg: #27272a;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --info: #3b82f6;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
        }

        h1, h2, h3, h4, h5 { font-family: 'Outfit', sans-serif; }

        /* ── Sidebar ── */
        .sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--card-border);
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            z-index: 100;
        }

        .sidebar-logo {
            padding: 1.5rem;
            font-size: 1.3rem;
            font-weight: 800;
            font-family: 'Outfit', sans-serif;
            border-bottom: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .sidebar-logo span { color: var(--primary-copper); }

        .sidebar-nav { padding: 1rem 0; flex-grow: 1; }

        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.8rem 1.5rem;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.2s;
            border-left: 3px solid transparent;
        }
        .sidebar-nav a:hover,
        .sidebar-nav a.active {
            color: var(--text-main);
            background-color: var(--hover-bg);
            border-left-color: var(--primary-copper);
        }

        .sidebar-nav .nav-icon { font-size: 1.1rem; width: 24px; text-align: center; }

        .sidebar-footer {
            padding: 1rem 1.5rem;
            border-top: 1px solid var(--card-border);
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .sidebar-footer a {
            color: var(--primary-copper);
            text-decoration: none;
        }

        /* ── Main Content ── */
        .main-content {
            margin-left: 260px;
            flex-grow: 1;
            padding: 2rem;
            min-height: 100vh;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
        .page-header h1 { font-size: 1.8rem; }
        .page-header .subtitle { color: var(--text-muted); margin-top: 0.25rem; font-size: 0.9rem; }

        /* ── Stat Cards ── */
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.2rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 1.5rem;
            transition: transform 0.25s, box-shadow 0.25s;
        }
        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        .stat-label { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-value { font-size: 2rem; font-weight: 700; font-family: 'Outfit', sans-serif; }
        .stat-value.copper { color: var(--primary-copper); }
        .stat-badge {
            display: inline-block;
            margin-top: 0.5rem;
            font-size: 0.75rem;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            font-weight: 600;
        }
        .badge-success { background: rgba(34,197,94,0.15); color: var(--success); }
        .badge-warning { background: rgba(245,158,11,0.15); color: var(--warning); }
        .badge-danger  { background: rgba(239,68,68,0.15);  color: var(--danger);  }
        .badge-info    { background: rgba(59,130,246,0.15);  color: var(--info);    }

        /* ── Tables ── */
        .panel {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 2rem;
        }
        .panel-header {
            padding: 1.2rem 1.5rem;
            border-bottom: 1px solid var(--card-border);
            font-weight: 700;
            font-family: 'Outfit', sans-serif;
            font-size: 1.1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        table { width: 100%; border-collapse: collapse; }
        th {
            text-align: left;
            padding: 0.8rem 1.5rem;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            border-bottom: 1px solid var(--card-border);
        }
        td {
            padding: 0.9rem 1.5rem;
            font-size: 0.9rem;
            border-bottom: 1px solid var(--card-border);
        }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background-color: var(--hover-bg); }

        .status-badge {
            display: inline-block;
            padding: 0.25rem 0.7rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .status-pending    { background: rgba(245,158,11,0.15); color: var(--warning); }
        .status-processing { background: rgba(59,130,246,0.15);  color: var(--info);    }
        .status-shipped    { background: rgba(139,92,246,0.15);  color: #8b5cf6;        }
        .status-delivered  { background: rgba(34,197,94,0.15);   color: var(--success);  }
        .status-cancelled  { background: rgba(239,68,68,0.15);   color: var(--danger);   }

        .alert-out   { color: var(--danger); font-weight: 700; }
        .alert-low   { color: var(--warning); font-weight: 700; }
        .alert-ok    { color: var(--success); }

        .btn-sm {
            padding: 0.35rem 0.8rem;
            font-size: 0.8rem;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-family: inherit;
            transition: transform 0.15s;
            text-decoration: none;
        }
        .btn-sm:hover { transform: translateY(-1px); }
        .btn-copper { background: linear-gradient(135deg, #d48c46, #b86d2a); color: #fff; }
        .btn-outline { background: transparent; border: 1px solid var(--card-border); color: var(--text-main); }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
        }

        @media (max-width: 900px) {
            .sidebar { display: none; }
            .main-content { margin-left: 0; }
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-logo">Kitchen <span>&</span> Kilowatt</div>
        <nav class="sidebar-nav">
            <a href="{% url 'dashboard:home' %}" class="{% if request.resolver_match.url_name == 'home' %}active{% endif %}">
                <span class="nav-icon">📊</span> Dashboard
            </a>
            <a href="{% url 'dashboard:orders' %}" class="{% if request.resolver_match.url_name == 'orders' %}active{% endif %}">
                <span class="nav-icon">📦</span> Orders
            </a>
            <a href="{% url 'dashboard:products' %}" class="{% if request.resolver_match.url_name == 'products' %}active{% endif %}">
                <span class="nav-icon">🏷️</span> Products
            </a>
            <a href="{% url 'dashboard:customers' %}" class="{% if request.resolver_match.url_name == 'customers' %}active{% endif %}">
                <span class="nav-icon">👥</span> Customers
            </a>
            <a href="{% url 'home' %}">
                <span class="nav-icon">🏠</span> Back to Store
            </a>
        </nav>
        <div class="sidebar-footer">
            Signed in as <strong>{{ request.user.username }}</strong><br>
            <a href="{% url 'accounts:logout' %}">Log out</a>
        </div>
    </aside>

    <!-- Main Content -->
    <div class="main-content">
        {% block dashboard_content %}{% endblock %}
    </div>
</body>
</html>
